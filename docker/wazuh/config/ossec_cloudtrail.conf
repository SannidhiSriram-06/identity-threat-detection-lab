<!--
  Wazuh AWS CloudTrail Integration Configuration
  Ingests AWS CloudTrail logs from S3 or via CloudTrail API
-->
<ossec_config>
  <wodle name="aws-s3">
    <disabled>no</disabled>
    <interval>5m</interval>
    <run_on_start>yes</run_on_start>
    <skip_on_error>yes</skip_on_error>

    <!-- CloudTrail Service Configuration -->
    <service type="cloudtrail">
      <!-- Bucket containing CloudTrail logs -->
      <aws_profile>default</aws_profile>
      <!-- Alternatively set <bucket>YOUR_CLOUDTRAIL_BUCKET_NAME</bucket> -->
      <!-- <aws_account_id>YOUR_AWS_ACCOUNT_ID</aws_account_id> -->
    </service>
  </wodle>
</ossec_config>
