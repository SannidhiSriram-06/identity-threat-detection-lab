version: '3.8'

services:
  # ============================================================================
  # 1. HashiCorp Vault (Community Edition)
  # Configured for AWS Secrets Engine (Short-lived, Just-In-Time IAM credentials)
  # ============================================================================
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-identity-lab
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data:/vault/file
      - ./vault/scripts:/vault/scripts:ro
    command: "vault server -config=/vault/config/vault.hcl"
    networks:
      - threat-lab-net

  # ============================================================================
  # 2. Wazuh Indexer (OpenSearch-based engine for alert storage & analytics)
  # ============================================================================
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.5
    container_name: wazuh-indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - "discovery.type=single-node"
      - "network.host=0.0.0.0"
      - "cluster.name=wazuh-cluster"
      - "node.name=wazuh-indexer"
      - "INDEXER_NAME=wazuh-indexer"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
    networks:
      - threat-lab-net

  # ============================================================================
  # 3. Wazuh Manager (Detection engine, AWS CloudTrail wodle & decoders)
  # ============================================================================
  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.5
    container_name: wazuh-manager
    restart: unless-stopped
    depends_on:
      - wazuh.indexer
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    environment:
      - INDEXER_URL=http://wazuh.indexer:9200
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - ./wazuh/config/ossec_cloudtrail.conf:/var/ossec/etc/shared/default/ossec_cloudtrail.conf:ro
      - ./wazuh/rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    networks:
      - threat-lab-net

  # ============================================================================
  # 4. Wazuh Dashboard (Web UI for SIEM alerts & MITRE ATT&CK dashboards)
  # ============================================================================
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.5
    container_name: wazuh-dashboard
    restart: unless-stopped
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    ports:
      - "443:5601"
    environment:
      - INDEXER_URL=http://wazuh.indexer:9200
      - WAZUH_API_URL=https://wazuh.manager
      - WAZUH_API_PORT=55000
      - DASHBOARD_SECURITY_DISABLED=true
    networks:
      - threat-lab-net

volumes:
  vault_data:
  wazuh_indexer_data:
  wazuh_manager_data:

networks:
  threat-lab-net:
    driver: bridge
